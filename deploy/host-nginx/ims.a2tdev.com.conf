# Install as /etc/nginx/sites-available/ims.a2tdev.com and enable it.
# The Docker gateway binds only to 127.0.0.1:8087, so it cannot conflict with
# another project's public ports.

limit_req_zone $binary_remote_addr zone=ims_login:10m rate=10r/m;

upstream ims_docker_gateway {
    server 127.0.0.1:8087;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ims.a2tdev.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ims.a2tdev.com;

    ssl_certificate /etc/letsencrypt/live/ims.a2tdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ims.a2tdev.com/privkey.pem;

    client_max_body_size 25m;
    server_tokens off;

    location = /login/ {
        limit_req zone=ims_login burst=5 nodelay;
        proxy_pass http://ims_docker_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://ims_docker_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
