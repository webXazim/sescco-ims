map $http_x_forwarded_proto $ims_forwarded_proto {
    default $scheme;
    ~*^https$ https;
}

map $http_x_real_ip $ims_real_ip {
    default $remote_addr;
    ~.+ $http_x_real_ip;
}

upstream ims_web_upstream {
    server ims_web:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /nginx-health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Private uploads are served only by authenticated Django views.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://ims_web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ims_real_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $ims_forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
