<div class="sourcing-field{% if full %} sourcing-field--full{% endif %}{% if field.errors %} has-error{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required or required_visual %}<span aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% if vendor_code_preview %}<small class="sourcing-vendor-code-preview" data-vendor-code-preview aria-live="polite">Your Vendor code is generated from its name when you save.</small>{% endif %}{% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}</div>
