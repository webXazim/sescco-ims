<details class="sourcing-unified-filters" {% if capability_filters.active or request.GET.tag %}open{% endif %}>
  <summary>Capability filters <span class="sourcing-unified-summary-help">Tags, category, availability, rates, location, verification</span></summary>
  <div class="sourcing-unified-filter-grid">
    <label><span>Company tag</span><input class="sourcing-input" type="search" name="tag" value="{{ request.GET.tag|default:'' }}" list="sourcing-provider-tags" maxlength="40" placeholder="Electrical, Mechanical, Civil"></label>
    <label><span>Category / type</span><select name="category" class="sourcing-select"><option value="">All categories</option>{% for item in capability_categories %}<option value="{{ item }}"{% if capability_filters.category == item %} selected{% endif %}>{{ item }}</option>{% endfor %}</select></label>
    <label><span>Availability</span><select name="availability" class="sourcing-select"><option value="all">Any availability</option>{% for value,label in availability_choices %}<option value="{{ value }}"{% if capability_filters.availability == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>
    <label><span>Verification</span><select name="freshness" class="sourcing-select"><option value="all">Any verification age</option><option value="fresh"{% if capability_filters.freshness == 'fresh' %} selected{% endif %}>Fresh (≤ {{ freshness_policy.fresh_for_days }} days)</option><option value="needs-verification"{% if capability_filters.freshness == 'needs-verification' %} selected{% endif %}>Needs verification</option><option value="stale"{% if capability_filters.freshness == 'stale' %} selected{% endif %}>Stale (&gt; {{ freshness_policy.stale_after_days }} days)</option><option value="never"{% if capability_filters.freshness == 'never' %} selected{% endif %}>Never verified</option></select></label>
    <label><span>Location</span><input type="search" class="sourcing-input" name="location" value="{{ capability_filters.location }}" placeholder="City, region or service location"></label>
    <label><span>Minimum reference rate</span><input type="number" class="sourcing-input" name="rate_min" min="0" step="0.0001" value="{{ capability_filters.rate_min }}" placeholder="Any"></label>
    <label><span>Maximum reference rate</span><input type="number" class="sourcing-input" name="rate_max" min="0" step="0.0001" value="{{ capability_filters.rate_max }}" placeholder="Any"></label>
    {% if rate_basis_choices %}<label><span>Rate basis</span><select class="sourcing-select" name="rate_basis"><option value="all">All rate bases</option>{% for value,label in rate_basis_choices %}<option value="{{ value }}"{% if capability_filters.rate_basis == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></label>{% endif %}
    <div class="sourcing-unified-filter-buttons"><button class="sourcing-btn sourcing-btn--primary" type="submit">Apply filters</button><a class="sourcing-btn" href="{{ request.path }}" data-unified-reset>Clear all</a></div>
  </div>
  <p class="sourcing-unified-note">Filters must match the same active capability record. Rates are references in their original currency and basis; compare like-for-like.</p>
</details>
