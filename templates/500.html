{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>System error · {{ APP_NAME|default:'SESCCO MS' }}</title>
  <link rel="icon" type="image/webp" href="{% static 'platform/brand-sescco-mark.webp' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <main class="error-page">
    <section class="card error-card">
      <div class="brand-mark brand-mark--image"><img src="{% static 'platform/brand-sescco-mark.webp' %}" alt="SESCCO"></div>
      <div class="error-code">500</div>
      <h1>Something went wrong</h1>
      <p>The request could not be completed. No changes should be assumed successful.</p>
      <a class="btn btn-primary" href="/app/">Return to workspace</a>
    </section>
  </main>
</body>
</html>
