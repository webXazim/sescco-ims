{# Shared name-confirmation dialog for Inventory, Suppliers and Projects. #}
<dialog class="inventory-delete-dialog" data-inventory-delete-dialog aria-labelledby="inventory-delete-dialog-title" aria-describedby="inventory-delete-dialog-description">
  <div class="inventory-delete-dialog__panel">
    <header class="inventory-delete-dialog__header">
      <div class="inventory-delete-dialog__heading">
        <span class="inventory-delete-dialog__eyebrow">Confirm deletion</span>
        <h2 id="inventory-delete-dialog-title" data-delete-title>Delete record</h2>
        <p id="inventory-delete-dialog-description" data-delete-subtitle></p>
      </div>
      <button class="inventory-delete-dialog__close" type="button" data-delete-close aria-label="Close confirmation">&times;</button>
    </header>
    <div class="inventory-delete-dialog__content">
      <p class="inventory-delete-dialog__loading" data-delete-loading role="status">Checking record…</p>
      <div data-delete-details hidden>
        <div class="inventory-delete-dialog__record"><span data-delete-type>Record</span><strong data-delete-record></strong></div>
        <div class="alert alert-danger inventory-delete-dialog__error" data-delete-error role="alert" hidden></div>
        <div class="alert alert-warning inventory-delete-dialog__blocked" data-delete-blocked hidden>
          <strong>This record cannot be deleted.</strong>
          <ul data-delete-blockers></ul>
        </div>
        <form method="post" class="inventory-delete-dialog__form" data-delete-form>
          {% csrf_token %}
          <label class="field" for="inventory-delete-name">
            <span class="field-label">Type <strong data-delete-token></strong> to delete</span>
            <input class="input" id="inventory-delete-name" name="confirmation" autocomplete="off" autocapitalize="off" spellcheck="false" required data-delete-name>
          </label>
          <div class="inventory-delete-dialog__actions">
            <button class="btn btn-ghost" type="button" data-delete-close>Cancel</button>
            <button class="btn btn-danger inventory-delete-dialog__submit" type="submit" data-delete-submit disabled>Delete</button>
          </div>
        </form>
        <div class="inventory-delete-dialog__actions" data-delete-blocked-actions hidden><button class="btn" type="button" data-delete-close>Close</button></div>
      </div>
    </div>
  </div>
</dialog>
