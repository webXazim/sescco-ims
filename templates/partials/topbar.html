<header class="topbar">

  {% if page_key == 'inventory' %}<div class="topbar-context"><strong>Inventory</strong><span>Live search and filters below</span></div>{% else %}<form class="top-search" method="get" action="{% url 'inventory:list' %}"><span aria-hidden="true"></span><input name="q" placeholder="Search inventory, projects, suppliers…"></form>{% endif %}

</header>
