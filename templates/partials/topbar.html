<header class="topbar inventory-topbar">
  <button class="menu-button" data-sidebar-toggle aria-label="Open navigation">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  {% if page_key == 'inventory' %}
    <div class="topbar-context"><strong>Inventory</strong><span>Live search and filters below</span></div>
  {% else %}
    <form class="top-search" method="get" action="{% url 'inventory:list' %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input name="q" placeholder="Search inventory, projects, suppliers…" aria-label="Search inventory, projects, suppliers">
    </form>
  {% endif %}
  <div class="top-actions"><a class="btn btn-sm" href="{% url 'projects:list' %}">Projects</a><a class="btn btn-primary btn-sm" href="{% url 'core:add_stock' %}">Add stock</a></div>
</header>
