<div class="field {% if field.name in full_width_fields %}field-full{% endif %}">
  <label class="field-label {% if field.field.required %}required{% endif %}" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
</div>
