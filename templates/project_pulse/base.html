{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page_title|default:'Project Pulse' }} · {{ APP_NAME }}</title>
  <link rel="icon" type="image/webp" href="{% static 'platform/brand-sescco-mark.webp' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="{% static 'platform/css/shell-switchers.css' %}">
  <link rel="stylesheet" href="{% static 'platform/css/inventory-shell.css' %}">
  <link rel="stylesheet" href="{% static 'project_pulse/css/project-pulse.css' %}?v=1.0.128">
  <link rel="stylesheet" href="{% static 'platform/css/typography-readability.css' %}?v=1.0.128">
</head>
<body class="inventory-shell-v2 pulse-shell" data-page="{{ page_key }}">
<div class="app-shell" id="inventoryAppShell" data-sidebar-collapsed="false" style="--inventory-sidebar-runtime:236px;">
  {% include 'project_pulse/sidebar.html' %}
  <main class="main">
    <header class="topbar inventory-topbar">
      <button class="menu-button" data-sidebar-toggle aria-label="Open navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="topbar-context"><strong>Project Pulse</strong><span>Project execution workspace</span></div>
      <div class="top-actions"><span class="pulse-header-tag">Execution schedule</span></div>
    </header>
    <div class="content pulse-content" id="pulse-main">
      {% if messages %}<div class="message-stack">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'success' }}">{{ message }}</div>{% endfor %}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <button class="inventory-collapsed-rail-toggle" type="button" data-inventory-sidebar-rail-toggle aria-label="Expand navigation" title="Expand navigation"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
</div>
<script src="{% static 'platform/js/shell-switchers.js' %}"></script>
<script src="{% static 'platform/js/inventory-shell.js' %}"></script>
<script src="{% static 'project_pulse/js/team.js' %}"></script>
<script src="{% static 'project_pulse/js/tasks.js' %}"></script>
</body>
</html>
