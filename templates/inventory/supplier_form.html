{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><h1 class="page-title">{{ page_title }}</h1><p class="page-subtitle">{{ page_subtitle }}</p></div></div>
<section class="card form-card narrow-form"><form method="post" novalidate>{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}{% include "partials/form_field.html" with field=field %}{% endfor %}</div><div class="form-actions"><a class="btn" href="{% url 'inventory:suppliers' %}">Cancel</a><button class="btn btn-primary" type="submit">{{ submit_label }}</button></div></form></section>
{% endblock %}
